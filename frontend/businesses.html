<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Directory | IDOMA CONNECT</title>
  <link rel="stylesheet" href="css/businesses.css" />
</head>
<body>

  <header class="header">
    <div class="logo">
      <a href="index.html">IDOMA CONNECT</a>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="add-business.html" class="nav-btn">+ List Your Business</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Business Directory</h1>
    <p>Discover verified businesses across the 9 LGAs of Idoma Land.</p>
  </section>

  <main class="container">

    <a href="add-business.html" class="add-business-btn">
      + List Your Business
    </a>

    <div class="filters">

      <input
        type="text"
        id="searchInput"
        placeholder="Search businesses..."
      />

      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="Hospital">Hospital</option>
        <option value="Pharmacy">Pharmacy</option>
        <option value="Hotel">Hotel</option>
        <option value="Restaurant">Restaurant</option>
        <option value="School">School</option>
        <option value="Market">Market</option>
        <option value="Boutique">Boutique</option>
        <option value="Salon">Salon</option>
        <option value="Tourist Attraction">Tourist Attraction</option>
      </select>

      <select id="lgaFilter">
        <option value="">All LGAs</option>
        <option value="Otukpo">Otukpo</option>
        <option value="Agatu">Agatu</option>
        <option value="Apa">Apa</option>
        <option value="Ado">Ado</option>
        <option value="Obi">Obi</option>
        <option value="Oju">Oju</option>
        <option value="Ohimini">Ohimini</option>
        <option value="Ogbadibo">Ogbadibo</option>
        <option value="Okpokwu">Okpokwu</option>
      </select>

    </div>

    <div class="business-grid">
      <!-- Businesses load dynamically from Neon -->
    </div>

  </main>

  <footer class="footer">
    <p>© 2026 IDOMA CONNECT • The Digital Gateway to Idoma Land</p>
  </footer>

  <script src="js/businesses.js"></script>

</body>
</html>
