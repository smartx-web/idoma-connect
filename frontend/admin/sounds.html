<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Sounds | IDOMA-CONNECT</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/refined.css"><style>.forms{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:white;padding:26px;border-radius:16px;border:1px solid #ddd}label{display:block;margin:16px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}button{margin:10px 6px 0 0;padding:12px 18px;border:0;border-radius:8px;background:#d71920;color:white;cursor:pointer}button:disabled{opacity:.5}article{border-bottom:1px solid #ddd;padding:18px 0}audio{width:100%;max-width:400px}@media(max-width:700px){.forms{grid-template-columns:1fr}}</style></head><body><main class="sound-shell"><a href="index.html">← Admin dashboard</a> · <a href="../idoma-sounds.html">View public Sounds</a><h1>Manage Idoma Sounds</h1><p>Create an artist, upload a song, then approve both to publish it.</p><p id="notice" role="status" aria-live="polite"></p><div class="forms"><section class="panel"><h2>Add artist</h2><form id="artistForm"><label for="artistName">Artist name</label><input id="artistName" required maxlength="200"><label for="stageName">Stage name (optional)</label><input id="stageName" maxlength="200"><label for="biography">Biography (optional)</label><textarea id="biography"></textarea><button>Create artist</button></form><div id="artistList"></div></section><section class="panel"><h2>Upload song</h2><form id="songForm"><label for="title">Song title</label><input id="title" required maxlength="200"><label for="artistId">Artist</label><select id="artistId" required><option value="">Choose an artist</option></select><label for="categoryId">Category (optional)</label><select id="categoryId"><option value="">No category</option></select><label for="audioFile">Audio file (maximum 50 MB)</label><input id="audioFile" type="file" accept="audio/*"><label for="audioUrl">Or paste an existing HTTPS audio URL</label><input id="audioUrl" type="url" placeholder="https://…"><p>Files upload to Cloudinary. If the upload preset rejects audio, use an existing hosted audio URL.</p><label for="coverFile">Cover image (optional, maximum 10 MB)</label><input id="coverFile" type="file" accept="image/*"><label for="description">Description (optional)</label><textarea id="description"></textarea><label><input id="rights" type="checkbox" required style="width:auto"> I have permission to publish this recording.</label><button>Upload and save song</button></form></section></div><section class="panel" style="margin-top:24px"><h2>Song approvals</h2><button id="refresh" type="button">Refresh lists</button><div id="songList">Loading…</div></section></main><script src="../js/admin-auth.js"></script><script>requireLogin();</script><script src="../js/admin-sounds.js"></script></body></html>
