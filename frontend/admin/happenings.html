<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin — Happenings | IDOMA-CONNECT</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <style>
        .admin-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 8px;
        }

        .admin-header p {
            color: #666;
        }

        .admin-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .admin-card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .publish-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .publish-group input {
            width: auto;
        }

        .submit-button {
            background: #d71920;
            color: #fff;
            border: none;
            padding: 13px 24px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .submit-button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .message.success {
            display: block;
            background: #e8f7ed;
            color: #18743c;
        }

        .message.error {
            display: block;
            background: #fdeaea;
            color: #b42318;
        }

        .happening-item {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .happening-item h3 {
            margin-bottom: 8px;
        }

        .happening-meta {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .published-badge {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 11px;
        }

        .draft-badge {
            display: inline-block;
            background: #777;
            color: white;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 11px;
        }

        @media (max-width: 700px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <header class="admin-header">
            <h1>Happenings</h1>

            <p>
                Add and manage recent happenings across Idoma Land.
            </p>
        </header>


        <!-- ADD HAPPENING -->

        <section class="admin-card">

            <h2>Add New Happening</h2>

            <form id="happeningForm">

                <div class="form-group">
                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter happening title"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the happening"
                        required
                    ></textarea>
                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >
                            <option value="">
                                Select category
                            </option>

                            <option value="Community">
                                Community
                            </option>

                            <option value="Culture">
                                Culture
                            </option>

                            <option value="Festival">
                                Festival
                            </option>

                            <option value="Technology">
                                Technology
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Business">
                                Business
                            </option>

                            <option value="Sports">
                                Sports
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Government">
                                Government
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="e.g. Otukpo, Benue State"
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="eventDate">
                            Event Date & Time
                        </label>

                        <input
                            type="datetime-local"
                            id="eventDate"
                            name="eventDate"
                        >

                    </div>


                    <div class="form-group">

    <label for="image">
        Happening Image
    </label>

    <input
        type="file"
        id="image"
        name="image"
        accept="image/*"
    >

    <small>
        Upload a clear image related to the happening.
    </small>

</div>
                </div>


                <div class="publish-group">

                    <input
                        type="checkbox"
                        id="published"
                        name="published"
                    >

                    <label for="published">
                        Publish immediately
                    </label>

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Add Happening
                </button>


                <div
                    id="message"
                    class="message"
                ></div>

            </form>

        </section>


        <!-- EXISTING HAPPENINGS -->

        <section class="admin-card">

            <h2>Existing Happenings</h2>

            <div id="happeningsList">
                Loading happenings...
            </div>

        </section>

    </div>


    <script src="../js/admin-happenings.js"></script>

</body>

</html>
