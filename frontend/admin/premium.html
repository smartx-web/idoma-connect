<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Listings | IDOMA-CONNECT Admin</title>

    <link rel="stylesheet" href="../css/admin.css">

    <style>
        .premium-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
        }

        .page-header p {
            margin: 6px 0 0;
            color: #667085;
        }

        .back-link {
            text-decoration: none;
            color: #b42318;
            font-weight: 600;
        }

        .premium-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
            align-items: start;
        }

        .premium-card {
            background: #fff;
            border: 1px solid #eaecf0;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(16, 24, 40, 0.05);
        }

        .premium-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #344054;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font: inherit;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #b42318;
            box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.08);
        }

        .upload-preview {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            border: 1px dashed #d0d5dd;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 10px;
            color: #667085;
            background: #f9fafb;
        }

        .upload-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            width: auto;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            background: #b42318;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #912018;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .message.success {
            display: block;
            background: #ecfdf3;
            color: #027a48;
        }

        .message.error {
            display: block;
            background: #fef3f2;
            color: #b42318;
        }

        .listing-list {
            display: grid;
            gap: 16px;
        }

        .listing-item {
            display: flex;
            gap: 18px;
            padding: 18px;
            border: 1px solid #eaecf0;
            border-radius: 10px;
            background: #fff;
        }

        .listing-image {
            width: 130px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            background: #f2f4f7;
            flex-shrink: 0;
        }

        .listing-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .listing-info {
            flex: 1;
        }

        .listing-info h3 {
            margin: 0 0 8px;
        }

        .listing-info p {
            margin: 5px 0;
            color: #667085;
        }

        .status {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.active {
            background: #ecfdf3;
            color: #027a48;
        }

        .status.inactive {
            background: #fef3f2;
            color: #b42318;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #667085;
            border: 1px dashed #d0d5dd;
            border-radius: 10px;
        }

        @media (max-width: 850px) {
            .premium-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .listing-item {
                flex-direction: column;
            }

            .listing-image {
                width: 100%;
                height: 180px;
            }
        }
    </style>
</head>

<body>

    <div class="premium-page">

        <div class="page-header">
            <div>
                <h1>Premium Listings</h1>
                <p>Promote approved businesses across IDOMA-CONNECT.</p>
            </div>

            <a href="index.html" class="back-link">
                ← Back to Dashboard
            </a>
        </div>

        <div class="premium-grid">

            <!-- CREATE PREMIUM LISTING -->
            <div class="premium-card">

                <h2>Create Premium Listing</h2>

                <form id="premiumForm">

                    <div class="form-group">
                        <label for="businessId">
                            Approved Business
                        </label>

                        <select id="businessId" required>
                            <option value="">
                                Loading approved businesses...
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="title">
                            Premium Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="e.g. Featured Business of the Week"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Write a short promotional description..."
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="image">
                            Promotional Image
                        </label>

                        <input
                            type="file"
                            id="image"
                            accept="image/*"
                        >

                        <div class="upload-preview" id="imagePreview">
                            No image selected
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="startDate">
                            Start Date
                        </label>

                        <input
                            type="datetime-local"
                            id="startDate"
                        >
                    </div>

                    <div class="form-group">
                        <label for="endDate">
                            End Date
                        </label>

                        <input
                            type="datetime-local"
                            id="endDate"
                        >
                    </div>

                    <div class="checkbox-group">
                        <input
                            type="checkbox"
                            id="active"
                            checked
                        >

                        <label for="active">
                            Active immediately
                        </label>
                    </div>

                    <button
                        type="submit"
                        class="submit-btn"
                        id="submitBtn"
                    >
                        Create Premium Listing
                    </button>

                    <div id="message" class="message"></div>

                </form>

            </div>

            <!-- EXISTING PREMIUM LISTINGS -->
            <div class="premium-card">

                <h2>Existing Premium Listings</h2>

                <div id="listingList" class="listing-list">

                    <div class="empty-state">
                        Loading premium listings...
                    </div>

                </div>

            </div>

        </div>

    </div>
    <script src="../js/admin-auth.js"></script>

<script>
requireLogin();
</script>

    <script src="../js/premium.js"></script>

</body>
</html>
