<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin — Businesses | IDOMA-CONNECT</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <style>
        .admin-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 8px;
        }

        .admin-header p {
            color: #666;
        }

        .admin-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .admin-card h2 {
            margin-bottom: 20px;
        }

        .pending-count {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-left: 8px;
        }

        .business-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .business-item {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 18px;
            background: #fff;
        }

        .business-image {
            width: 180px;
            height: 150px;
            border-radius: 10px;
            object-fit: cover;
            background: #f1f1f1;
        }

        .business-image-placeholder {
            width: 180px;
            height: 150px;
            border-radius: 10px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 13px;
            text-align: center;
        }

        .business-content h3 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .business-meta {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .business-description {
            color: #444;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .business-contact {
            font-size: 14px;
            margin-bottom: 12px;
        }

        .business-contact div {
            margin-bottom: 4px;
        }

        .pending-badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .business-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-button {
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .approve-button {
            background: #198754;
            color: #fff;
        }

        .approve-button:hover {
            opacity: 0.9;
        }

        .reject-button {
            background: #dc3545;
            color: #fff;
        }

        .reject-button:hover {
            opacity: 0.9;
        }

        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            color: #666;
            padding: 20px 0;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: #444;
        }

        .error-message {
            background: #fdeaea;
            color: #b42318;
            padding: 14px;
            border-radius: 8px;
        }

        .success-message {
            background: #e8f7ed;
            color: #18743c;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .refresh-button {
            background: #222;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }

        .refresh-button:hover {
            opacity: 0.9;
        }

        @media (max-width: 700px) {

            .business-item {
                grid-template-columns: 1fr;
            }

            .business-image,
            .business-image-placeholder {
                width: 100%;
                height: 200px;
            }

            .business-actions {
                flex-direction: column;
            }

            .action-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <header class="admin-header">

            <h1>
                Business Approvals
                <span
                    id="pendingCount"
                    class="pending-count"
                >
                    0 Pending
                </span>
            </h1>

            <p>
                Review and manage businesses submitted to the IDOMA-CONNECT directory.
            </p>

            <button
                type="button"
                id="refreshButton"
                class="refresh-button"
            >
                Refresh Submissions
            </button>

        </header>


        <section class="admin-card">

            <h2>Pending Businesses</h2>

            <div id="message"></div>

            <div
                id="businessesList"
                class="business-list"
            >
                <div class="loading">
                    Loading pending businesses...
                </div>
            </div>

        </section>

    </div>


    <script src="../js/admin-businesses.js"></script>

</body>

</html>
