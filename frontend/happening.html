<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happening | IDOMA-CONNECT</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>
        .happening-page {
            max-width: 1150px;
            margin: 0 auto;
            padding: 35px 20px 80px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            color: #b30000;
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .happening-article {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .happening-cover-wrapper {
            position: relative;
            width: 100%;
            height: 520px;
            background: #111111;
        }

        .happening-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.65),
                rgba(0, 0, 0, 0.05) 60%
            );
            pointer-events: none;
        }

        .cover-label {
            position: absolute;
            bottom: 25px;
            left: 30px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .happening-content {
            padding: 45px;
        }

        .happening-category {
            display: inline-block;
            background: #b30000;
            color: #ffffff;
            padding: 7px 15px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .happening-title {
            margin: 0 0 20px;
            font-size: 46px;
            line-height: 1.12;
            color: #151515;
        }

        .happening-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            color: #666666;
            font-size: 15px;
        }

        .happening-meta span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .happening-description {
            color: #303030;
            font-size: 18px;
            line-height: 1.9;
            white-space: pre-line;
        }

        .story-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid #eeeeee;
        }

        .share-button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .share-button:hover {
            transform: translateY(-1px);
        }

        .share-primary {
            background: #b30000;
            color: #ffffff;
        }

        .share-secondary {
            background: #eeeeee;
            color: #222222;
        }

        .share-message {
            width: 100%;
            display: none;
            margin-top: 5px;
            color: #16803c;
            font-size: 14px;
            font-weight: 600;
        }

        .related-section {
            margin-top: 55px;
        }

        .related-heading {
            margin-bottom: 25px;
        }

        .related-heading h2 {
            margin: 0 0 7px;
            font-size: 30px;
            color: #171717;
        }

        .related-heading p {
            margin: 0;
            color: #666666;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .related-card {
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.07);
            transition: transform 0.2s ease;
        }

        .related-card:hover {
            transform: translateY(-4px);
        }

        .related-card a {
            color: inherit;
            text-decoration: none;
        }

        .related-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background: #f1f1f1;
        }

        .related-content {
            padding: 18px;
        }

        .related-category {
            display: inline-block;
            margin-bottom: 8px;
            color: #b30000;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .related-content h3 {
            margin: 0 0 10px;
            font-size: 19px;
            line-height: 1.3;
        }

        .related-content p {
            margin: 0;
            color: #666666;
            font-size: 14px;
            line-height: 1.6;
        }

        .related-empty {
            color: #777777;
            font-size: 15px;
        }

        .loading-state,
        .error-state {
            text-align: center;
            padding: 80px 20px;
        }

        .loading-state {
            color: #666666;
        }

        .error-state {
            display: none;
        }

        .error-state h2 {
            margin-bottom: 10px;
            color: #b30000;
        }

        .error-state p {
            color: #666666;
        }

        .error-state a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #b30000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }

        @media (max-width: 850px) {
            .related-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .happening-cover-wrapper {
                height: 400px;
            }

            .happening-title {
                font-size: 38px;
            }
        }

        @media (max-width: 600px) {
            .happening-page {
                padding: 25px 15px 60px;
            }

            .happening-cover-wrapper {
                height: 280px;
            }

            .cover-label {
                left: 20px;
                bottom: 18px;
            }

            .happening-content {
                padding: 28px 20px;
            }

            .happening-title {
                font-size: 30px;
            }

            .happening-description {
                font-size: 16px;
                line-height: 1.8;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }

            .related-image {
                height: 210px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="businesses.html">Businesses</a>
            <a href="hall-of-fame.html">Hall of Fame</a>
            <a href="heritage.html">Heritage</a>
            <a href="happenings.html">Happenings</a>
        </nav>
    </header>

    <main class="happening-page">

        <a
            href="happenings.html"
            class="back-link"
        >
            ← Back to Happenings
        </a>

        <div
            id="loading"
            class="loading-state"
        >
            Loading story...
        </div>

        <div
            id="error"
            class="error-state"
        >
            <h2>Happening not found</h2>

            <p>
                We could not find the story you are looking for.
            </p>

            <a href="happenings.html">
                View All Happenings
            </a>
        </div>

        <article
            id="happeningArticle"
            class="happening-article"
            style="display: none;"
        >

            <div class="happening-cover-wrapper">

                <img
                    id="happeningImage"
                    class="happening-cover"
                    src="images/placeholder.jpg"
                    alt=""
                >

                <div class="cover-overlay"></div>

                <div
                    id="coverLabel"
                    class="cover-label"
                >
                    Happening in Idoma Land
                </div>

            </div>

            <div class="happening-content">

                <span
                    id="happeningCategory"
                    class="happening-category"
                >
                    Happening
                </span>

                <h1
                    id="happeningTitle"
                    class="happening-title"
                >
                </h1>

                <div class="happening-meta">

                    <span id="happeningDate">
                        📅 —
                    </span>

                    <span id="happeningLocation">
                        📍 —
                    </span>

                </div>

                <div
                    id="happeningDescription"
                    class="happening-description"
                >
                </div>

                <div class="story-actions">

                    <button
                        id="shareButton"
                        class="share-button share-primary"
                    >
                        📤 Share Story
                    </button>

                    <button
                        id="copyButton"
                        class="share-button share-secondary"
                    >
                        🔗 Copy Link
                    </button>

                    <div
                        id="shareMessage"
                        class="share-message"
                    ></div>

                </div>

            </div>

        </article>

        <section
            id="relatedSection"
            class="related-section"
            style="display: none;"
        >

            <div class="related-heading">

                <h2>
                    More from Happenings
                </h2>

                <p>
                    Discover more stories and events from Idoma Land.
                </p>

            </div>

            <div
                id="relatedGrid"
                class="related-grid"
            >
            </div>

        </section>

    </main>

    <script src="js/happening.js"></script>

</body>
</html>
