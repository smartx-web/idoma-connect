<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View business details, location, contact information and services on IDOMA CONNECT."
    >

    <title>Business Details | IDOMA CONNECT</title>


    <!-- Business page styles -->
    <link
        rel="stylesheet"
        href="css/business.css"
    >


    <!-- Leaflet map styles -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <a
        href="index.html"
        class="logo"
    >
        IDOMA CONNECT
    </a>


    <a
        href="businesses.html"
        class="back-btn"
    >
        ← Back
    </a>

</header>



<!-- =========================================
     MAIN CONTENT
========================================= -->

<section class="container">


    <!-- Loading -->

    <div
        id="loading"
        class="loading"
    >
        Loading business...
    </div>



    <!-- Error -->

    <div
        id="error"
        class="error-box"
        style="display:none;"
    >

        <h2>
            Business Not Found
        </h2>

        <p>
            We couldn't find this business.
        </p>

        <a
            href="businesses.html"
            class="back-btn"
        >
            Browse Businesses
        </a>

    </div>



    <!-- =====================================
         BUSINESS DETAILS
    ====================================== -->

    <div
        id="business"
        class="business-details"
        style="display:none;"
    >


        <!-- =================================
             BUSINESS IMAGE
        ================================== -->

        <div class="image-wrapper">

            <img
                id="businessImage"
                class="hero-image"
                src=""
                alt="Business Image"
            >

        </div>



        <!-- =================================
             BUSINESS INFORMATION
        ================================== -->

        <div class="info">


            <!-- Premium Badge -->

            <span
                id="premiumBadge"
                class="premium-badge"
                style="display:none;"
            >
                PREMIUM FEATURED
            </span>



            <!-- Category -->

            <span
                id="category"
                class="badge"
            ></span>



            <!-- Business Name -->

            <h1 id="name"></h1>



            <!-- Verification -->

            <p
                id="verified"
                class="verified"
            ></p>



            <!-- Description -->

            <p
                id="description"
                class="description"
            ></p>



            <!-- =================================
                 BUSINESS INFORMATION
            ================================== -->

            <div class="details">


                <div class="detail-row">

                    <strong>
                        📍 Address
                    </strong>

                    <span id="address"></span>

                </div>



                <div class="detail-row">

                    <strong>
                        🏛 LGA
                    </strong>

                    <span id="lga"></span>

                </div>



                <div class="detail-row">

                    <strong>
                        📞 Phone
                    </strong>

                    <span id="phone"></span>

                </div>


            </div>



            <!-- =================================
                 LOCATION
            ================================== -->

            <div class="location-section">


                <h2>
                    📍 Location
                </h2>


                <p id="locationText">
                    Loading location...
                </p>


                <div id="map"></div>


                <a
                    id="mapBtn"
                    class="map-btn"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View on Google Maps
                </a>


            </div>



            <!-- =================================
                 CONTACT ACTIONS
            ================================== -->

            <div class="actions">


                <a
                    id="callBtn"
                    class="call-btn"
                >
                    📞 Call Business
                </a>


                <a
                    id="whatsappBtn"
                    class="whatsapp-btn"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    💬 WhatsApp
                </a>


            </div>


        </div>


    </div>


</section>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="business-footer">

    <p>
        IDOMA CONNECT — The Digital Gateway to Idoma Land.
    </p>

</footer>



<!-- =========================================
     LEAFLET JAVASCRIPT
========================================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<!-- =========================================
     BUSINESS JAVASCRIPT
========================================= -->

<script src="js/business.js"></script>


</body>

</html>
