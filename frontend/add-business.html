<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Your Business | IDOMA CONNECT</title>
    <link rel="stylesheet" href="css/add-business.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">IDOMA CONNECT</a>
    <a href="businesses.html" class="back-btn">← Directory</a>
</header>

<div class="container">

    <h1>List Your Business</h1>

    <p class="subtitle">
        Join the largest digital directory for businesses across Idoma Land.
    </p>

    <form id="businessForm">

        <label>Business Name</label>
        <input type="text" id="name" required>

        <label>Description</label>
        <textarea id="description" rows="3" required></textarea>

        <label>Category</label>
        <select id="category" required>
            <option value="">Select category</option>
            <option>Hospital</option>
            <option>Pharmacy</option>
            <option>Hotel</option>
            <option>Restaurant</option>
            <option>School</option>
            <option>Market</option>
            <option>Boutique</option>
            <option>Salon</option>
            <option>Tourist Attraction</option>
        </select>

        <label>LGA</label>
        <select id="lga" required>
            <option value="">Select LGA</option>
            <option>Otukpo</option>
            <option>Agatu</option>
            <option>Apa</option>
            <option>Ado</option>
            <option>Obi</option>
            <option>Oju</option>
            <option>Ohimini</option>
            <option>Ogbadibo</option>
            <option>Okpokwu</option>
        </select>

        <label>Address</label>
        <input type="text" id="address" required>

        <label>Phone</label>
        <input type="text" id="phone" required>

        <label>WhatsApp</label>
        <input type="text" id="whatsapp" required>

        <label>Business Image</label>
        <input type="file" id="image" accept="image/*">

        <img
            id="preview"
            class="image-preview"
            src=""
            alt="Business Preview"
            style="display:none;"
        >

        <button type="submit" class="submit-btn">
            Submit Business
        </button>

    </form>

    <div id="message"></div>

</div>

<script src="js/add-business.js"></script>

</body>
</html>
